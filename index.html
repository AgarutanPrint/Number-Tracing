<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Tracing</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: 'Segoe UI', Verdana, Arial, sans-serif; background: #f4f6fb;
    min-height: 100vh; display: flex; justify-content: center; padding: 20px 12px;
    touch-action: manipulation; overflow-x: hidden; color: #2c2c40;
  }
  .app { width: 100%; max-width: 480px; }
  .card { background: #fff; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 22px 18px; overflow-x: hidden; }
  button { font-family: inherit; }

  /* ---------- menu ---------- */
  .brand { text-align: center; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #9aa0ab; font-weight: 700; margin-bottom: 6px; }
  .app-title { text-align: center; font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  .app-subtitle { text-align: center; color: #777; font-size: 13px; margin-bottom: 18px; }
  .tile-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .tile { position: relative; aspect-ratio: 3 / 4; min-width: 0; border: none; border-radius: 16px; background: #eef1fb; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform .1s; overflow: hidden; }
  .tile:active { transform: scale(.95); }
  .tile .ch { display: block; line-height: 0; }
  .dglyph { display: block; width: auto; }
  .tile .wd { font-size: 11px; color: #8a90a0; margin-top: 6px; }
  .tile .star { position: absolute; top: 3px; right: 4px; font-size: 13px; }

  .reset-row { text-align: center; margin-top: 16px; }
  .reset-btn { border: none; background: transparent; color: #9aa0ab; font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 10px; cursor: pointer; }
  .reset-btn:hover, .reset-btn:active { background: #f0f2f8; color: #6b7280; }

  /* ---------- top bar ---------- */
  .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 12px; }
  .back-btn, .nav-btn, .icon-btn { background: #eceef4; border: none; border-radius: 10px; font-weight: 700; color: #33334d; cursor: pointer; }
  .back-btn { padding: 8px 12px; font-size: 13px; }
  .nav-btns { display: flex; gap: 6px; }
  .nav-btn { width: 34px; height: 34px; font-size: 15px; }
  .nav-btn:disabled { opacity: .35; cursor: default; }
  .icon-btn { width: 34px; height: 34px; font-size: 15px; }

  /* ---------- study ---------- */
  .study-header { text-align: center; margin-bottom: 10px; }
  .pair-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .pair { line-height: 0; }
  .word-lbl { font-size: 16px; color: #7a8090; margin-top: 2px; font-weight: 700; }
  .speak-btn { background: #eef1fb; border: none; border-radius: 50%; width: 38px; height: 38px; font-size: 17px; cursor: pointer; }
  .speak-btn:active { transform: scale(.9); }
  .speak-status { font-size: 11px; color: #3f7be0; min-height: 14px; margin-top: 2px; }
  .tabs { display: flex; background: #f0f2f8; border-radius: 12px; padding: 4px; margin-bottom: 14px; gap: 2px; }
  .tab-btn { flex: 1; min-width: 0; border: none; background: transparent; border-radius: 9px; padding: 9px 1px; font-size: 11px; font-weight: 700; color: #777; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-btn.active { background: #2c2c40; color: #fff; }
  .stage { width: 100%; margin: 0 auto 10px; }
  .stage-svg { width: 100%; height: auto; max-height: 54vh; display: block; touch-action: none; user-select: none; -webkit-user-select: none; overflow: visible; background: #fafbfe; border: 2px solid #e4e7f0; border-radius: 14px; }
  .stage.narrow { max-width: 320px; }
  .control-row { display: flex; gap: 10px; margin-bottom: 8px; }
  .ctrl-btn { flex: 1; min-width: 0; border: none; border-radius: 10px; padding: 11px 10px; font-size: 13px; font-weight: 700; cursor: pointer; background: #eceef4; color: #33334d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctrl-btn.primary { background: #2c2c40; color: #fff; }
  .hint-text { text-align: center; font-size: 12px; color: #999; margin-top: 4px; }

  /* tracer svg parts */
  .road-o { stroke: #c9ceda; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .road-f { stroke: #eef0f5; stroke-width: 21; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .road-d { stroke: #8f97a6; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.1 4.6; fill: none; }
  .prog { stroke: #3f7be0; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .arrow { fill: #22344a; }
  .numdot circle { fill: #2e9e5b; stroke: #fff; stroke-width: 1.4; }
  .numdot text { fill: #fff; font-size: 8.5px; font-weight: 800; text-anchor: middle; pointer-events: none; font-family: 'Segoe UI', Verdana, Arial, sans-serif; }
  .numdot.upcoming { opacity: .55; }
  .numdot.done { opacity: .2; }
  .numdot.active { opacity: 1; }
  .numdot.active circle { animation: pulse 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3); } }
  .stage-svg.lo .road-o { stroke-width: 21; }
  .stage-svg.lo .road-f { stroke-width: 17; }
  .stage-svg.lo .prog { stroke-width: 12; }
  .pen { fill: #ff7043; stroke: #fff; stroke-width: 1.6; pointer-events: none; }

  /* count tab */
  .count-goal { text-align: center; font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .count-goal b { color: #3f7be0; }
  .frame-wrap svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .frame-cell { fill: #fff; stroke: #2a2a2a; stroke-width: 2.5; cursor: pointer; }
  .frame-dot { stroke: #2a2a2a; stroke-width: 2.5; pointer-events: none; transition: fill .12s; }
  .count-status { text-align: center; min-height: 20px; font-size: 14px; font-weight: 700; color: #7a8090; margin: 10px 0 8px; }
  .count-status.bad { color: #e53935; }

  /* color tab */
  .palette { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #d6dae4; cursor: pointer; padding: 0; }
  .swatch.sel { box-shadow: 0 0 0 3px #2c2c40; transform: scale(1.12); }
  .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .ctile { background: #fff; border: 2px solid #e4e7f0; border-radius: 12px; padding: 4px; cursor: pointer; }
  .ctile svg { width: 100%; height: auto; display: block; max-height: 150px; }

  /* write tab */
  .write-wrap svg { touch-action: none; user-select: none; -webkit-user-select: none; }

  /* celebration */
  .cele-back { position: fixed; inset: 0; background: rgba(20,24,40,.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .cele { background: #fff; border-radius: 20px; padding: 26px 22px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
  .cele .big { font-size: 54px; }
  .cele h2 { margin: 6px 0 4px; font-size: 22px; }
  .cele p { margin: 0 0 14px; color: #777; font-size: 14px; }
  .stars { margin: 6px 0 14px; }
  .star-pop { display: inline-block; font-size: 30px; opacity: 0; transform: scale(.2); animation: popIn .4s forwards; }
  @keyframes popIn { to { opacity: 1; transform: scale(1); } }
  .cele .control-row { margin-bottom: 0; }
</style>
</head>

<script>
/* ---- tiny SVG path sampler (M L H V C A and relative h), no DOM geometry needed ---- */
function pathToPolyline(d){
  var toks = d.match(/[MLHVCAhmlvca]|-?\d*\.?\d+(?:e[-+]?\d+)?/gi) || [];
  var i = 0, cmd = '', x = 0, y = 0, sx = 0, sy = 0, pts = [];
  function num(){ return parseFloat(toks[i++]); }
  while(i < toks.length){
    if(/[a-z]/i.test(toks[i])) cmd = toks[i++];
    if(cmd === 'M'){ x = num(); y = num(); sx = x; sy = y; pts.push([x,y]); cmd = 'L'; }
    else if(cmd === 'L'){ x = num(); y = num(); pts.push([x,y]); }
    else if(cmd === 'H'){ x = num(); pts.push([x,y]); }
    else if(cmd === 'V'){ y = num(); pts.push([x,y]); }
    else if(cmd === 'h'){ x += num(); pts.push([x,y]); }
    else if(cmd === 'C'){
      var x1 = num(), y1 = num(), x2 = num(), y2 = num(), x3 = num(), y3 = num();
      for(var k = 1; k <= 30; k++){
        var t = k/30, u = 1-t;
        pts.push([u*u*u*x + 3*u*u*t*x1 + 3*u*t*t*x2 + t*t*t*x3,
                  u*u*u*y + 3*u*u*t*y1 + 3*u*t*t*y2 + t*t*t*y3]);
      }
      x = x3; y = y3;
    }
    else if(cmd === 'A'){
      var rx = Math.abs(num()), ry = Math.abs(num()); num(); // x-axis-rotation ignored (always 0)
      var fa = num(), fs = num(), ex = num(), ey = num();
      var dx2 = (x-ex)/2, dy2 = (y-ey)/2;
      var lam = dx2*dx2/(rx*rx) + dy2*dy2/(ry*ry);
      if(lam > 1){ var sq = Math.sqrt(lam); rx *= sq; ry *= sq; }
      var sign = (fa !== fs) ? 1 : -1;
      var num_ = rx*rx*ry*ry - rx*rx*dy2*dy2 - ry*ry*dx2*dx2;
      var den = rx*rx*dy2*dy2 + ry*ry*dx2*dx2;
      var coef = sign * Math.sqrt(Math.max(0, num_/den));
      var cxp = coef * (rx*dy2/ry), cyp = coef * (-ry*dx2/rx);
      var cx = cxp + (x+ex)/2, cy = cyp + (y+ey)/2;
      var th1 = Math.atan2((dy2-cyp)/ry, (dx2-cxp)/rx);
      var th2 = Math.atan2((-dy2-cyp)/ry, (-dx2-cxp)/rx);
      var dth = th2 - th1;
      if(!fs && dth > 0) dth -= 2*Math.PI;
      if(fs && dth < 0) dth += 2*Math.PI;
      var n = Math.max(12, Math.ceil(Math.abs(dth)/(Math.PI/36)));
      for(var m = 1; m <= n; m++){
        var th = th1 + dth*m/n;
        pts.push([cx + rx*Math.cos(th), cy + ry*Math.sin(th)]);
      }
      x = ex; y = ey;
    }
  }
  return pts;
}
// evenly spaced samples along the polyline; returns {pts:[[x,y]...], L, step}
function samplePath(d, step){
  var poly = pathToPolyline(d), cum = [0];
  for(var i = 1; i < poly.length; i++){
    cum.push(cum[i-1] + Math.hypot(poly[i][0]-poly[i-1][0], poly[i][1]-poly[i-1][1]));
  }
  var L = cum[cum.length-1];
  if(L < 0.5) return {pts:[poly[0]], L:0, step:step, dot:true};
  var out = [], j = 1, n = Math.ceil(L/step);
  for(var k = 0; k <= n; k++){
    var s = Math.min(k*step, L);
    while(j < cum.length-1 && cum[j] < s) j++;
    var seg = cum[j] - cum[j-1] || 1, f = (s - cum[j-1]) / seg;
    out.push([poly[j-1][0] + (poly[j][0]-poly[j-1][0])*f, poly[j-1][1] + (poly[j][1]-poly[j-1][1])*f]);
  }
  return {pts:out, L:L, step:step, dot:false};
}

      return true;
    }
    return false;
  };
  tr.reset = function(){
    tr.stop();
    strokes.forEach(function(s){ s.p = -1; s.done = false; showProgress(s, -1); });
    tr.cur = 0; tr.finished = false; pen.setAttribute('opacity', 0); setActive(0);
  };
  tr.stop = function(){ if(tr.anim){ cancelAnimationFrame(tr.anim.raf); tr.anim = null; } };
  // animated demo (Watch tab)
  tr.play = function(onEnd){
    tr.reset();
    var i = 0, phase = 'draw', t0 = performance.now(), anim = { raf: 0 };
    tr.anim = anim; setActive(0);
    function frame(now){
      var st = strokes[i];
      if(phase === 'draw'){
        var dur = st.dot ? 450 : Math.min(2200, Math.max(600, st.L / 48 * 1000));
        var f = Math.min(1, (now - t0) / dur);
        if(st.dot){ if(f >= 0.6){ showProgress(st, 0); } }
        else {
          var p = Math.floor(f * (st.pts.length - 1));
          showProgress(st, f >= 1 ? st.pts.length - 1 : p);
          var pt = st.pts[Math.min(st.pts.length - 1, Math.max(0, p))];
          pen.setAttribute('cx', pt[0]); pen.setAttribute('cy', pt[1]); pen.setAttribute('opacity', 1);
        }
        if(f >= 1){ st.done = true; setActive(i + 1); pen.setAttribute('opacity', 0); phase = 'wait'; t0 = now; }
      } else if(now - t0 > 380){
        i++;
        if(i >= strokes.length){ tr.anim = null; setActive(-1); if(onEnd) onEnd(); return; }
        phase = 'draw'; t0 = now;
      }
      anim.raf = requestAnimationFrame(frame);
    }
    anim.raf = requestAnimationFrame(frame);
  };
  setActive(0);

  if(opt.interactive){
    var down = false, last = null;
    var toRoot = function(e){
      var mm = svg.getScreenCTM && svg.getScreenCTM();
      if(!mm) return null;
      var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      var r = pt.matrixTransform(mm.inverse());
      return [r.x, r.y];
    };
    var feed = function(e){
      var p = toRoot(e); if(!p) return;
      if(last){
        var dx = p[0]-last[0], dy = p[1]-last[1], n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 2));
        for(var k = 1; k <= n; k++) tr.advance(last[0] + dx*k/n, last[1] + dy*k/n);
      } else tr.advance(p[0], p[1]);
      last = p;
    };
    svg.addEventListener('pointerdown', function(e){ e.preventDefault(); down = true; last = null; try{ svg.setPointerCapture(e.pointerId); }catch(_){} feed(e); });
    svg.addEventListener('pointermove', function(e){ if(down){ e.preventDefault(); feed(e); } });
    var up = function(){ down = false; last = null; };
    svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  }
  return tr;
}
function digitTracer(i, opt){
  var g = digitGlyph(i);
  return buildTracer('up', [{strokes: g.strokes, arrows: g.arrows, dx: 55 - g.cx}], 110, opt);   // 110 wide so the 4's long bar has room
}
function wordTracer(word, opt){
  var cursor = 30, items = [], GAP = 30;
  word.split('').forEach(function(ch){
    var g = LOWER[ch];
    items.push({strokes: g.s, dx: cursor - g.x0});
    cursor += (g.x1 - g.x0) + GAP;
  });
  var W = cursor - GAP + 30;
  var o = opt || {}; o.R = 15;
  return { tracer: buildTracer('lo', items, W, o), W: W };
}

/* ================= CELEBRATION ================= */
function celebrate(o){
  var old = document.querySelector('.cele-back'); if(old) old.remove();
  var back = H('div', 'cele-back'), box = H('div', 'cele');
  box.innerHTML = '<div class="big">' + (o.emoji || '🎉') + '</div><h2>' + o.title + '</h2><p>' + (o.text || '') + '</p>';
  var stars = H('div', 'stars');
  for(var i = 0; i < 5; i++){ var s = H('span', 'star-pop', '⭐'); s.style.animationDelay = (i * .14) + 's'; stars.appendChild(s); }
  box.appendChild(stars);
  var row = H('div', 'control-row');
  (o.buttons || []).forEach(function(b, i){
    var btn = H('button', 'ctrl-btn' + (i === (o.buttons.length - 1) ? ' primary' : ''), b.label);
    btn.addEventListener('click', function(){ back.remove(); if(b.fn) b.fn(); });
    row.appendChild(btn);
  });
  box.appendChild(row); back.appendChild(box); document.body.appendChild(back);
  sfx.chime();
}
function nextNumberButton(){
  return state.idx < 9
    ? {label: 'Next number →', fn: function(){ state.idx++; render(); }}
    : {label: 'Back to menu', fn: function(){ state.screen = 'menu'; render(); }};
}

/* ================= RENDER ROOT ================= */
function render(){
  cleanup();
  var card = document.getElementById('app-card');
  card.innerHTML = '';
  card.appendChild(state.screen === 'menu' ? renderMenu() : renderStudy());
}

/* ---------- MENU ---------- */
function renderMenu(){
  var root = H('div');
  root.innerHTML = '<div class="brand">Agarutan Print</div><div class="app-title">Number Tracing</div><div class="app-subtitle">0–9 · tap a number to start</div>';
  var prog = loadProg(), grid = H('div', 'tile-grid');
  for(var i = 0; i < 10; i++){
    (function(i){
      var t = H('button', 'tile', '<span class="ch"></span><span class="wd">' + NUM_WORDS[i] + '</span>' + (prog['n' + i] ? '<span class="star">⭐</span>' : ''));
      t.querySelector('.ch').appendChild(digitSVG(i, 46));
      t.addEventListener('click', function(){ state.screen = 'study'; state.idx = i; state.tab = 'watch'; render(); });
      grid.appendChild(t);
    })(i);
  }
  root.appendChild(grid);
  var starCount = Object.keys(prog).filter(function(k){ return prog[k]; }).length;
  if(starCount > 0){
    var rr = H('div', 'reset-row'), rb = H('button', 'reset-btn', '↺ Reset stars (' + starCount + ')');
    rb.addEventListener('click', confirmReset);
    rr.appendChild(rb); root.appendChild(rr);
  }
  return root;
}

// asks first, so a child cannot wipe the stars by accident
function confirmReset(){
  var old = document.querySelector('.cele-back'); if(old) old.remove();
  var back = H('div', 'cele-back'), box = H('div', 'cele');
  box.innerHTML = '<div class="big">🧹</div><h2>Start fresh?</h2><p>This takes away all the ⭐ stars so a new learner can begin again.</p>';
  var row = H('div', 'control-row'), keep = H('button', 'ctrl-btn', 'Keep stars'), go = H('button', 'ctrl-btn primary', 'Reset stars');
  keep.addEventListener('click', function(){ back.remove(); });
  go.addEventListener('click', function(){
    try{ localStorage.removeItem('nt_progress'); }catch(e){}
    state.counts = {}; state.fills = {};
    back.remove(); sfx.pop(); render();
  });
  row.appendChild(keep); row.appendChild(go); box.appendChild(row); back.appendChild(box); document.body.appendChild(back);
}

/* ---------- STUDY ---------- */
function renderStudy(){
  var n = state.idx, root = H('div');
  var bar = H('div', 'top-bar');
  var back = H('button', 'back-btn', '← Menu');
  back.addEventListener('click', function(){ state.screen = 'menu'; render(); });
  var snd = H('button', 'icon-btn', soundOn ? '🔔' : '🔕');
  snd.title = 'Sound on/off';
  snd.addEventListener('click', function(){ soundOn = !soundOn; try{ localStorage.setItem('nt_sound', soundOn ? 'on' : 'off'); }catch(e){} snd.textContent = soundOn ? '🔔' : '🔕'; if(soundOn) sfx.pop(); });
  var nav = H('div', 'nav-btns');
  var prev = H('button', 'nav-btn', '‹'), next = H('button', 'nav-btn', '›');
  prev.disabled = n === 0; next.disabled = n === 9;
  prev.addEventListener('click', function(){ state.idx--; render(); });
  next.addEventListener('click', function(){ state.idx++; render(); });
  nav.appendChild(prev); nav.appendChild(next);
  bar.appendChild(back); bar.appendChild(snd); bar.appendChild(nav);
  root.appendChild(bar);

  var head = H('div', 'study-header');
  head.innerHTML = '<div class="pair-row"><div class="pair"></div></div><div class="word-lbl">' + NUM_WORDS[n] + '</div><div class="speak-status" id="speak-status"></div>';
  head.querySelector('.pair').setAttribute('aria-label', String(n));
  head.querySelector('.pair').appendChild(digitSVG(n, 58));
  var sp = H('button', 'speak-btn', '🔊'); sp.title = 'Hear it';
  sp.addEventListener('click', function(){ speak(NUM_WORDS[n]); });
  head.querySelector('.pair-row').appendChild(sp);
  root.appendChild(head);

  var tabs = H('div', 'tabs');
  [['watch', '▶ Watch'], ['trace', '✍ Trace'], ['count', '🔢 Count'], ['color', '🎨 Color'], ['write', '✏️ Write'], ['word', '🔤 Word']].forEach(function(t){
    var b = H('button', 'tab-btn' + (state.tab === t[0] ? ' active' : ''), t[1]);
    b.addEventListener('click', function(){ state.tab = t[0]; render(); });
    tabs.appendChild(b);
  });
  root.appendChild(tabs);

  var body = H('div');
  if(state.tab === 'watch') body.appendChild(tabWatch());
  else if(state.tab === 'trace') body.appendChild(tabTrace());
  else if(state.tab === 'count') body.appendChild(tabCount());
  else if(state.tab === 'color') body.appendChild(tabColor());
  else if(state.tab === 'write') body.appendChild(tabWrite());
  else body.appendChild(tabWord());
  root.appendChild(body);
  return root;
}

function stageWrap(svg, narrow){ var w = H('div', 'stage' + (narrow ? ' narrow' : '')); w.appendChild(svg); return w; }

function tabWatch(){
  var box = H('div'), tr = digitTracer(state.idx, {});
  currentTracer = tr;
  box.appendChild(stageWrap(tr.svg, true));
  var row = H('div', 'control-row');
  var rp = H('button', 'ctrl-btn', '⟲ Replay'), go = H('button', 'ctrl-btn primary', '✍ Now you try');
  rp.addEventListener('click', function(){ tr.play(); });
  go.addEventListener('click', function(){ state.tab = 'trace'; render(); });
  row.appendChild(rp); row.appendChild(go); box.appendChild(row);
  box.appendChild(H('div', 'hint-text', 'Watch the numbers and arrows — that is how we write it!'));
  setTimeout(function(){ if(currentTracer === tr) tr.play(); }, 250);
  return box;
}

function tabTrace(){
  var box = H('div'), n = state.idx;
  var tr = digitTracer(n, {interactive: true});
  currentTracer = tr;
  tr.onDone = function(){
    markDone('n' + n);
    setTimeout(function(){
      celebrate({
        title: 'Great job!', text: 'You traced the number ' + n + '!',
        buttons: [{label: 'Again', fn: function(){ render(); }}, nextNumberButton()]
      });
    }, 350);
  };
  box.appendChild(stageWrap(tr.svg, true));
  var row = H('div', 'control-row'), rs = H('button', 'ctrl-btn', '↺ Start over');
  rs.addEventListener('click', function(){ render(); });
  row.appendChild(rs); box.appendChild(row);
  box.appendChild(H('div', 'hint-text', 'Put your finger on the green dot and follow the road. Then the next number!'));
  return box;
}

/* ---------- COUNT (the workbook's ten-frame: color as many circles as the number) ---------- */
function tabCount(){
  var box = H('div'), n = state.idx;
  var flags = state.counts[n] || (state.counts[n] = [false, false, false, false, false, false, false, false, false, false]);
  var goal = H('div', 'count-goal');
  goal.innerHTML = n === 0 ? 'Zero means <b>none</b>. Do not color any circle!' : 'Color <b>' + n + '</b> circle' + (n === 1 ? '' : 's') + '.';
  box.appendChild(goal);
  var wrap = H('div', 'frame-wrap'), svg = S('svg', {viewBox: '0 0 300 124'});
  var dots = [];
  for(var k = 0; k < 10; k++){
    (function(k){
      var cx = (k % 5) * 60, cy = Math.floor(k / 5) * 60 + 2;
      var cell = S('rect', {x: cx + 1.5, y: cy + 1.5, width: 57, height: 57, 'class': 'frame-cell'}, svg);
      var dot = S('circle', {cx: cx + 30, cy: cy + 30, r: 21, 'class': 'frame-dot', fill: flags[k] ? PALETTE[k % PALETTE.length] : '#ffffff'}, svg);
      dots.push(dot);
      cell.addEventListener('click', function(){
        flags[k] = !flags[k];
        dot.setAttribute('fill', flags[k] ? PALETTE[k % PALETTE.length] : '#ffffff');
        var c = flags.filter(Boolean).length;
        status.className = 'count-status'; status.textContent = 'You colored ' + c;
        sfx.pop();
        if(soundOn && window.speechSynthesis) speak(NUM_WORDS[c]);
      });
    })(k);
  }
  wrap.appendChild(svg); box.appendChild(wrap);
  var status = H('div', 'count-status', 'You colored ' + flags.filter(Boolean).length);
  box.appendChild(status);
  var row = H('div', 'control-row'), clr = H('button', 'ctrl-btn', '↺ Clear'), chk = H('button', 'ctrl-btn primary', '✓ Check');
  clr.addEventListener('click', function(){
    for(var k = 0; k < 10; k++){ flags[k] = false; dots[k].setAttribute('fill', '#ffffff'); }
    status.className = 'count-status'; status.textContent = 'You colored 0';
  });
  chk.addEventListener('click', function(){
    var c = flags.filter(Boolean).length;
    if(c === n){
      status.className = 'count-status'; status.textContent = 'Yes! ' + n + '!';
      celebrate({
        title: 'Perfect counting!',
        text: n === 0 ? 'Zero means none — you colored no circles!' : 'You colored ' + n + ' circle' + (n === 1 ? '' : 's') + '!',
        buttons: [{label: 'Again', fn: function(){ state.counts[n] = null; render(); }}, nextNumberButton()]
      });
    } else {
      status.className = 'count-status bad';
      status.textContent = (c < n ? 'Almost! ' : 'Oops! ') + 'You colored ' + c + '. We need ' + n + '.';
      sfx.buzz();
    }
  });
  row.appendChild(clr); row.appendChild(chk); box.appendChild(row);
  box.appendChild(H('div', 'hint-text', 'Tap a circle to color it. Tap again to take the color away.'));
  return box;
}

/* ---------- COLOR ---------- */
function outlineTile(g, fillColor){
  var svg = S('svg', {viewBox: '-8 -2 116 146'}), gg = S('g', {transform: 'translate(' + (50 - g.cx) + ',0)'}, svg), inner = [];
  g.strokes.forEach(function(d){ S('path', {d: d, fill: 'none', stroke: '#2a2a2a', 'stroke-width': 27, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, gg); });
  g.strokes.forEach(function(d){ inner.push(S('path', {d: d, fill: 'none', stroke: fillColor || '#ffffff', 'stroke-width': 19, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, gg)); });
  return { svg: svg, inner: inner };
}
function tabColor(){
  var box = H('div'), g = digitGlyph(state.idx);
  var pal = H('div', 'palette');
  function paintPalette(){
    pal.innerHTML = '';
    PALETTE.forEach(function(c){
      var b = H('button', 'swatch' + (state.color === c ? ' sel' : '')); b.style.background = c; b.setAttribute('aria-label', 'color ' + c);
      b.addEventListener('click', function(){ state.color = c; sfx.pop(); paintPalette(); });
      pal.appendChild(b);
    });
  }
  paintPalette(); box.appendChild(pal);
  var grid = H('div', 'color-grid'), tiles = [];
  for(var k = 0; k < 12; k++){
    (function(k){
      var key = 'n' + g.ch + '_' + k, t = H('div', 'ctile'), o = outlineTile(g, state.fills[key]);
      t.appendChild(o.svg); tiles.push({o: o, key: key});
      t.addEventListener('click', function(){
        state.fills[key] = state.color;
        o.inner.forEach(function(p){ p.setAttribute('stroke', state.color); });
        sfx.pop();
      });
      grid.appendChild(t);
    })(k);
  }
  box.appendChild(grid);
  var row = H('div', 'control-row'), clr = H('button', 'ctrl-btn', '🧹 Clear colors');
  clr.addEventListener('click', function(){ tiles.forEach(function(t){ delete state.fills[t.key]; t.o.inner.forEach(function(p){ p.setAttribute('stroke', '#ffffff'); }); }); });
  row.appendChild(clr); box.appendChild(row);
  box.appendChild(H('div', 'hint-text', 'Pick a color, then tap a number. Use a different color for each one!'));
  return box;
}

/* ---------- WRITE ---------- */
function tabWrite(){
  var box = H('div', 'write-wrap'), g = digitGlyph(state.idx), m = VB.up;
  var W = 400, rowH = 142, rows = 4, Hh = rows * rowH, s = 0.74;
  var svg = S('svg', {viewBox: '0 0 ' + W + ' ' + Hh, 'class': 'stage-svg'});
  svg.style.maxHeight = 'none';
  for(var r = 0; r < rows; r++){
    var y0 = r * rowH + 10;
    var yy = function(v){ return y0 + (v - 15) * s; };
    S('line', {x1: 6, x2: W - 6, y1: yy(m.top), y2: yy(m.top), stroke: '#c3c9d4', 'stroke-width': 1}, svg);
    S('line', {x1: 6, x2: W - 6, y1: yy(m.mid), y2: yy(m.mid), stroke: '#d3d8e1', 'stroke-width': 1, 'stroke-dasharray': '4 4'}, svg);
    S('line', {x1: 6, x2: W - 6, y1: yy(m.base), y2: yy(m.base), stroke: '#c3c9d4', 'stroke-width': 1}, svg);
    if(r < 2){
      for(var c = 0; c < 4; c++){
        var gx = 50 + c * 100, grp = S('g', {transform: 'translate(' + (gx - g.cx * s) + ',' + (y0 - 15 * s) + ') scale(' + s + ')', opacity: r === 0 ? 1 : 0.7}, svg);
        g.strokes.forEach(function(d){ S('path', {d: d, fill: 'none', stroke: '#8f97a6', 'stroke-width': 3.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-dasharray': '0.1 7'}, grp); });
      }
    }
  }
  var ink = S('g', {}, svg), curPath = null, curD = '', down = false;
  function toRoot(e){
    var mm = svg.getScreenCTM && svg.getScreenCTM(); if(!mm) return null;
    var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    var r2 = pt.matrixTransform(mm.inverse()); return [r2.x, r2.y];
  }
  svg.addEventListener('pointerdown', function(e){
    e.preventDefault(); var p = toRoot(e); if(!p) return; down = true;
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    curD = 'M' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ' L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
    curPath = S('path', {d: curD, fill: 'none', stroke: '#3f7be0', 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, ink);
  });
  svg.addEventListener('pointermove', function(e){
    if(!down || !curPath) return; e.preventDefault(); var p = toRoot(e); if(!p) return;
    curD += ' L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1); curPath.setAttribute('d', curD);
  });
  function up(){ down = false; curPath = null; }
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  box.appendChild(svg);
  var row = H('div', 'control-row'), clr = H('button', 'ctrl-btn', '🗑 Clear');
  clr.addEventListener('click', function(){ while(ink.firstChild) ink.removeChild(ink.firstChild); });
  row.appendChild(clr); box.appendChild(row);
  box.appendChild(H('div', 'hint-text', 'Trace the dotted numbers, then write your own on the empty lines.'));
  return box;
}

/* ---------- WORD ---------- */
function tabWord(){
  var box = H('div'), n = state.idx, word = NUM_WORDS[n];
  box.appendChild(H('div', 'hint-text', '<span style="font-size:13px">Trace the word:</span> <b style="font-size:20px;color:#2c2c40">' + n + ' = ' + word + '</b>'));
  var wt = wordTracer(word, {interactive: true}), tr = wt.tracer;
  currentTracer = tr;
  tr.onDone = function(){
    setTimeout(function(){
      celebrate({title: 'Wow!', text: 'You traced "' + word + '"!', buttons: [{label: 'Again', fn: function(){ render(); }}, nextNumberButton()]});
    }, 350);
  };
  var w = stageWrap(tr.svg, false); w.style.marginTop = '8px'; box.appendChild(w);
  var row = H('div', 'control-row'), rs = H('button', 'ctrl-btn', '↺ Start over'), hr = H('button', 'ctrl-btn', '🔊 Say it');
  rs.addEventListener('click', function(){ render(); });
  hr.addEventListener('click', function(){ speak(word); });
  row.appendChild(rs); row.appendChild(hr); box.appendChild(row);
  box.appendChild(H('div', 'hint-text', 'Trace each letter in order, from left to right.'));
  return box;
}

render();
